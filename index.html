<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AWF Real Estate | Building Dreams. Creating Value.</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://tailwindcss.com"></script>
  <!-- Supabase JS Library CDN -->
  <script src="https://jsdelivr.net"></script>
  <style>
    @import url('https://googleapis.com');
    body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0b0c10; color: #c5c6c7; }
    .glass-card { background: rgba(31, 41, 55, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.05); }
  </style>
</head>
<body class="min-h-screen flex flex-col justify-between">

  <!-- NAVIGATION HEADER -->
  <header class="border-b border-gray-800 bg-[#0f111a] sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-4 py-4 flex justify-between items-center">
      <div class="text-xl font-bold tracking-wider text-white">AWF REAL ESTATE</div>
      <nav class="hidden md:flex space-x-6 text-sm font-medium">
        <a href="#" class="text-gray-400 hover:text-white transition">Home</a>
        <a href="#" class="text-gray-400 hover:text-white transition">Properties</a>
        <a href="#" class="text-white border-b-2 border-emerald-500 pb-1">Manage Listings</a>
      </nav>
      <button onclick="document.getElementById('manager-modal').classList.remove('hidden')" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold uppercase tracking-wider px-4 py-2 rounded transition">
        Open Manager
      </button>
    </div>
  </header>

  <!-- MAIN MANAGER INTERFACE -->
  <main class="max-w-4xl mx-auto px-4 py-10 w-full flex-grow">
    <div class="glass-card rounded-2xl p-6 md:p-10 shadow-2xl">
      <div class="flex justify-between items-center border-b border-gray-800 pb-5 mb-8">
        <div>
          <h1 class="text-2xl font-bold text-white tracking-tight">AWF Property Manager</h1>
          <p class="text-xs text-gray-400 mt-1">Private management console & security sync</p>
        </div>
        <span class="bg-emerald-500/10 text-emerald-400 border border-emerald-500/20 text-[10px] font-bold uppercase tracking-widest px-2.5 py-1 rounded-full">
          DB Synced
        </span>
      </div>

      <!-- PROPERTY UPLOAD FORM -->
      <form id="property-upload-form" class="space-y-6">
        
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Property Name</label>
            <input type="text" id="prop-name" required placeholder="e.g. 5 Bedroom Fully Detached Duplex" class="w-full bg-[#0f111a] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Country</label>
            <input type="text" id="prop-country" required placeholder="Nigeria" class="w-full bg-[#0f111a] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">City</label>
            <input type="text" id="prop-city" required placeholder="Abuja" class="w-full bg-[#0f111a] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Location/Address</label>
            <input type="text" id="prop-location" required placeholder="Guzape, behind H-Medix" class="w-full bg-[#0f111a] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition">
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Type</label>
            <select id="prop-type" class="w-full bg-[#0f111a] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition">
              <option value="For Sale">For Sale</option>
              <option value="For Rent">For Rent</option>
              <option value="Investment">Investment</option>
              <option value="International">International</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Status</label>
            <select id="prop-status" class="w-full bg-[#0f111a] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition">
              <option value="Available">Available</option>
              <option value="Reserved">Reserved</option>
              <option value="Sold">Sold</option>
            </select>
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Currency</label>
            <select id="prop-currency" class="w-full bg-[#0f111a] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition">
              <option value="₦">₦ (Naira)</option>
              <option value="$">$ (USD)</option>
              <option value="£">£ (GBP)</option>
              <option value="AED">AED</option>
            </select>
          </div>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-4 gap-6">
          <div class="md:col-span-2">
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Price (Numbers Only)</label>
            <input type="text" id="prop-price" required placeholder="e.g. 875000000" class="w-full bg-[#0f111a] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Bedrooms</label>
            <input type="number" id="prop-bedrooms" required placeholder="5" class="w-full bg-[#0f111a] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition">
          </div>
          <div>
            <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Size (Sqm)</label>
            <input type="number" id="prop-size" required placeholder="1000" class="w-full bg-[#0f111a] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition">
          </div>
        </div>

        <div>
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-2">Description</label>
          <textarea id="prop-description" rows="4" required placeholder="Enter full property details, special structures, features, professional fee requirements..." class="w-full bg-[#0f111a] border border-gray-800 rounded-lg px-4 py-3 text-white text-sm focus:outline-none focus:border-emerald-500 transition"></textarea>
        </div>

        <!-- MOBILE FILE UPLOAD FIELD -->
        <div class="border-2 border-dashed border-gray-800 rounded-xl p-6 bg-[#0f111a]/50 text-center">
          <label class="block text-xs font-bold uppercase tracking-wider text-gray-400 mb-3">Property Video Walkthrough (Max 50MB)</label>
          <input type="file" id="prop-video-file" accept="video/*" class="block w-full text-xs text-gray-400 file:mr-4 file:py-2 file:px-4 file:rounded-full file:border-0 file:text-xs file:font-semibold file:bg-gray-800 file:text-white hover:file:bg-gray-700 cursor-pointer">
          <p class="text-[11px] text-gray-500 mt-2">Videos under 50 seconds shot on mobile usually stay under our free-tier memory thresholds.</p>
        </div>

        <!-- FORM ACTION BUTTONS -->
        <div class="flex justify-end space-x-4 pt-4">
          <button type="reset" class="bg-gray-800 hover:bg-gray-700 text-white text-xs font-bold uppercase tracking-wider px-6 py-3.5 rounded-lg transition">
            Clear Form
          </button>
          <button type="submit" id="submit-btn" class="bg-emerald-600 hover:bg-emerald-700 text-white text-xs font-bold uppercase tracking-wider px-8 py-3.5 rounded-lg transition shadow-lg shadow-emerald-900/20">
            Save Property Live
          </button>
        </div>

      </form>
    </div>
  </main>

  <footer class="border-t border-gray-800 py-6 text-center text-xs text-gray-500 bg-[#0f111a]">
    &copy; AWF Real Estate. All database systems live and secure.
  </footer>
