<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
      maximum-scale=1.0, user-scalable=no">

<meta name="theme-color" content="#050505">

<meta name="description"
content="AWF Real Estate — premium real estate, property sales, rentals and investment opportunities in Nigeria and selected international markets.">

<title>AWF Real Estate | Building Dreams. Creating Value.</title>

<style>

/* =========================================================
   AWF REAL ESTATE — LUXURY 2026 SYSTEM
========================================================= */

:root{
    --black:#050505;
    --black2:#090909;
    --black3:#101010;
    --panel:#111111;
    --panel2:#151515;

    --gold:#d4af37;
    --gold-light:#f4d77a;
    --gold-dark:#8f6d16;

    --white:#f7f5ef;
    --muted:#aaa59a;
    --line:rgba(212,175,55,.18);

    --green:#48d597;
    --red:#ff6464;
    --blue:#75a9ff;

    --shadow:0 30px 80px rgba(0,0,0,.55);

    --radius:26px;
}

/* =========================================================
   RESET
========================================================= */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
    background:var(--black);
}

body{
    font-family:
    Inter,
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;

    background:
    radial-gradient(circle at 50% -10%,
        rgba(212,175,55,.09),
        transparent 30%),
    var(--black);

    color:var(--white);
    line-height:1.6;
    overflow-x:hidden;
}

body.menu-open{
    overflow:hidden;
}

img{
    max-width:100%;
    display:block;
}

a{
    color:inherit;
    text-decoration:none;
}

button,
input,
textarea,
select{
    font:inherit;
}

/* =========================================================
   GLOBAL EFFECTS
========================================================= */

::selection{
    background:var(--gold);
    color:#000;
}

.gold{
    color:var(--gold);
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

.section{
    padding:110px 0;
    position:relative;
}

.section-label{
    display:flex;
    align-items:center;
    gap:14px;

    color:var(--gold);
    text-transform:uppercase;
    letter-spacing:4px;
    font-size:.72rem;
    font-weight:800;

    margin-bottom:20px;
}

.section-label::before{
    content:"";
    width:48px;
    height:1px;
    background:linear-gradient(
        90deg,
        var(--gold),
        transparent
    );
}

.section-title{
    font-family:
    Georgia,
    "Times New Roman",
    serif;

    font-size:clamp(2.4rem,7vw,5.2rem);
    line-height:.98;
    letter-spacing:-2px;
    max-width:800px;
}

.section-title span{
    color:var(--gold);
}

.section-text{
    color:var(--muted);
    max-width:650px;
    margin-top:24px;
    font-size:1rem;
}

/* =========================================================
   HEADER
========================================================= */

header{
    position:fixed;
    top:0;
    left:0;
    right:0;

    z-index:500;

    height:88px;

    background:
    linear-gradient(
        180deg,
        rgba(5,5,5,.95),
        rgba(5,5,5,.72)
    );

    backdrop-filter:blur(20px);
    -webkit-backdrop-filter:blur(20px);

    border-bottom:1px solid rgba(255,255,255,.04);
}

.navbar{
    width:min(1400px,94%);
    height:100%;
    margin:auto;

    display:grid;
    grid-template-columns:1fr auto 1fr;
    align-items:center;
}

/* CENTER LOGO */

.logo-wrap{
    grid-column:2;
    justify-self:center;

    display:flex;
    align-items:center;
    justify-content:center;

    height:72px;
}

.logo-wrap img{
    width:125px;
    height:auto;

    object-fit:contain;

    /* makes dark areas blend into website */
    mix-blend-mode:screen;

    filter:
    drop-shadow(0 0 8px rgba(212,175,55,.12));

    transition:.4s ease;
}

.logo-wrap img:hover{
    transform:scale(1.04);
    filter:
    drop-shadow(0 0 20px rgba(212,175,55,.25));
}

/* MENU BUTTON */

.menu-button{
    grid-column:3;
    justify-self:end;

    width:54px;
    height:54px;

    border:1px solid rgba(212,175,55,.16);
    border-radius:18px;

    background:rgba(255,255,255,.025);

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;

    transition:.35s ease;
}

.menu-button:hover{
    border-color:var(--gold);
    background:rgba(212,175,55,.08);
}

.menu-lines{
    width:25px;
    display:flex;
    flex-direction:column;
    gap:6px;
}

.menu-lines span{
    display:block;
    height:2px;
    background:var(--white);
    border-radius:10px;
    transition:.35s ease;
}

.menu-button.active .menu-lines span:nth-child(1){
    transform:translateY(8px) rotate(45deg);
}

.menu-button.active .menu-lines span:nth-child(2){
    opacity:0;
}

.menu-button.active .menu-lines span:nth-child(3){
    transform:translateY(-8px) rotate(-45deg);
}

/* =========================================================
   SIDE MENU
========================================================= */

.side-menu{
    position:fixed;
    inset:0;
    z-index:400;

    background:
    radial-gradient(
        circle at 50% 0%,
        rgba(212,175,55,.09),
        transparent 35%
    ),
    rgba(5,5,5,.97);

    backdrop-filter:blur(30px);
    -webkit-backdrop-filter:blur(30px);

    display:flex;
    align-items:center;
    justify-content:center;

    opacity:0;
    visibility:hidden;

    transition:.4s ease;
}

.side-menu.open{
    opacity:1;
    visibility:visible;
}

.menu-content{
    width:min(500px,90%);
    text-align:center;
}

.menu-brand{
    margin-bottom:40px;
}

.menu-brand img{
    width:145px;
    margin:auto;

    mix-blend-mode:screen;

    filter:
    drop-shadow(0 0 20px rgba(212,175,55,.18));
}

.menu-links{
    display:flex;
    flex-direction:column;
    gap:7px;
}

.menu-links a{
    padding:13px 20px;

    font-family:Georgia,serif;
    font-size:1.5rem;

    border-radius:15px;

    color:#ddd;

    transition:.3s ease;
}

.menu-links a:hover{
    color:var(--gold);
    background:rgba(212,175,55,.06);
    transform:translateY(-2px);
}

.menu-contact{
    margin-top:35px;

    display:flex;
    justify-content:center;
    gap:10px;
    flex-wrap:wrap;
}

/* =========================================================
   BUTTONS
========================================================= */

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:9px;

    min-height:50px;
    padding:0 22px;

    border-radius:14px;

    font-size:.85rem;
    font-weight:800;

    cursor:pointer;

    border:1px solid transparent;

    transition:.35s ease;
}

.btn-gold{
    background:linear-gradient(
        135deg,
        var(--gold-light),
        var(--gold)
    );

    color:#090909;

    box-shadow:
    0 10px 35px rgba(212,175,55,.12);
}

.btn-gold:hover{
    transform:translateY(-3px);
    box-shadow:
    0 16px 45px rgba(212,175,55,.22);
}

.btn-outline{
    border-color:rgba(212,175,55,.32);
    color:var(--white);
    background:rgba(255,255,255,.02);
}

.btn-outline:hover{
    border-color:var(--gold);
    color:var(--gold);
    background:rgba(212,175,55,.06);
}

.btn-dark{
    background:#0d0d0d;
    border-color:rgba(255,255,255,.08);
    color:#eee;
}

/* =========================================================
   HERO
========================================================= */

.hero{
    min-height:100svh;

    padding-top:88px;

    display:flex;
    align-items:center;

    position:relative;
    overflow:hidden;
}

.hero::before{
    content:"";

    position:absolute;

    width:650px;
    height:650px;

    left:50%;
    top:38%;

    transform:translate(-50%,-50%);

    background:
    radial-gradient(
        circle,
        rgba(212,175,55,.12),
        transparent 68%
    );

    filter:blur(30px);

    pointer-events:none;
}

.hero-grid{
    display:grid;

    grid-template-columns:
    minmax(0,1.05fr)
    minmax(300px,.95fr);

    gap:60px;

    align-items:center;
}

/* HERO LOGO */

.hero-logo{
    position:relative;

    display:flex;
    align-items:center;
    justify-content:center;

    min-height:500px;
}

.hero-logo::before{
    content:"";

    position:absolute;

    width:420px;
    height:420px;

    border-radius:50%;

    background:
    radial-gradient(
        circle,
        rgba(212,175,55,.11),
        transparent 67%
    );

    filter:blur(18px);
}

.hero-logo img{
    position:relative;
    z-index:2;

    width:min(560px,95%);

    mix-blend-mode:screen;

    filter:
    drop-shadow(0 0 35px rgba(212,175,55,.14));

    animation:
    logoFloat 7s ease-in-out infinite;
}

@keyframes logoFloat{
    0%,100%{
        transform:translateY(0);
    }

    50%{
        transform:translateY(-10px);
    }
}

.hero-content{
    position:relative;
    z-index:2;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:10px;

    padding:8px 13px;

    border:1px solid rgba(212,175,55,.2);

    border-radius:999px;

    background:rgba(212,175,55,.035);

    color:var(--gold-light);

    font-size:.68rem;
    font-weight:800;

    text-transform:uppercase;
    letter-spacing:2.5px;

    margin-bottom:24px;
}

.eyebrow::before{
    content:"";
    width:6px;
    height:6px;
    background:var(--gold);
    border-radius:50%;
    box-shadow:0 0 12px var(--gold);
}

.hero-title{
    font-family:
    Georgia,
    "Times New Roman",
    serif;

    font-size:clamp(3.2rem,8vw,7.2rem);

    line-height:.9;

    letter-spacing:-4px;
}

.hero-title span{
    color:var(--gold);
}

.hero-description{
    color:var(--muted);

    font-size:1.03rem;

    max-width:580px;

    margin-top:27px;
}

.hero-actions{
    display:flex;
    gap:12px;
    flex-wrap:wrap;

    margin-top:32px;
}

.hero-mini{
    display:flex;
    gap:30px;

    margin-top:42px;

    padding-top:25px;

    border-top:1px solid rgba(255,255,255,.07);
}

.mini-stat strong{
    display:block;

    font-family:Georgia,serif;

    color:var(--white);

    font-size:1.5rem;
}

.mini-stat span{
    color:#777;
    font-size:.7rem;
    text-transform:uppercase;
    letter-spacing:1.4px;
}

/* =========================================================
   MARQUEE
========================================================= */

.marquee{
    border-top:1px solid rgba(212,175,55,.1);
    border-bottom:1px solid rgba(212,175,55,.1);

    overflow:hidden;

    padding:17px 0;

    background:rgba(212,175,55,.015);
}

.marquee-track{
    display:flex;
    width:max-content;

    animation:marquee 28s linear infinite;
}

.marquee-item{
    display:flex;
    align-items:center;
    gap:25px;

    padding:0 28px;

    color:#777;

    text-transform:uppercase;
    letter-spacing:3px;

    font-size:.65rem;
    font-weight:700;
}

.marquee-item b{
    color:var(--gold);
    font-size:1rem;
}

@keyframes marquee{
    to{
        transform:translateX(-50%);
    }
}

/* =========================================================
   ABOUT
========================================================= */

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
    align-items:center;
}

.about-visual{
    position:relative;

    min-height:550px;

    border-radius:35px;

    border:1px solid rgba(212,175,55,.15);

    background:
    radial-gradient(
        circle at 50% 40%,
        rgba(212,175,55,.12),
        transparent 45%
    ),
    linear-gradient(
        145deg,
        #15140f,
        #070707 70%
    );

    overflow:hidden;

    display:flex;
    align-items:center;
    justify-content:center;
}

.about-visual::before{
    content:"AWF";

    position:absolute;

    font-family:Georgia,serif;

    font-size:14rem;
    font-weight:bold;

    color:rgba(212,175,55,.025);

    letter-spacing:-15px;
}

.about-visual img{
    width:75%;
    position:relative;
    z-index:2;

    mix-blend-mode:screen;

    filter:
    drop-shadow(0 0 30px rgba(212,175,55,.18));
}

.about-points{
    margin-top:35px;

    display:grid;
    gap:17px;
}

.about-point{
    display:flex;
    gap:15px;
}

.point-icon{
    flex:0 0 40px;
    height:40px;

    border-radius:12px;

    border:1px solid rgba(212,175,55,.2);

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--gold);
}

.about-point h4{
    font-size:.9rem;
    margin-bottom:3px;
}

.about-point p{
    color:#858585;
    font-size:.78rem;
}

/* =========================================================
   SERVICES
========================================================= */

.services-grid{
    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:15px;

    margin-top:55px;
}

.service-card{
    position:relative;

    min-height:300px;

    padding:28px;

    border:1px solid rgba(255,255,255,.07);

    border-radius:24px;

    background:
    linear-gradient(
        145deg,
        rgba(255,255,255,.045),
        rgba(255,255,255,.012)
    );

    overflow:hidden;

    transition:.4s ease;
}

.service-card::after{
    content:"";

    position:absolute;

    width:140px;
    height:140px;

    right:-70px;
    bottom:-70px;

    background:
    radial-gradient(
        circle,
        rgba(212,175,55,.14),
        transparent 65%
    );
}

.service-card:hover{
    transform:translateY(-7px);

    border-color:
    rgba(212,175,55,.28);

    box-shadow:
    0 25px 60px rgba(0,0,0,.35);
}

.service-number{
    color:rgba(212,175,55,.5);

    font-family:Georgia,serif;

    font-size:.75rem;

    letter-spacing:2px;
}

.service-icon{
    margin-top:55px;

    font-size:2rem;

    color:var(--gold);
}

.service-card h3{
    margin-top:20px;

    font-family:Georgia,serif;

    font-size:1.35rem;
}

.service-card p{
    color:#777;
    font-size:.78rem;
    margin-top:9px;
}

/* =========================================================
   PROPERTY SECTION
========================================================= */

.properties-head{
    display:flex;
    justify-content:space-between;
    align-items:end;
    gap:30px;
}

.property-controls{
    display:flex;
    gap:8px;
    flex-wrap:wrap;

    margin-top:40px;
}

.filter-btn{
    border:1px solid rgba(255,255,255,.08);

    background:#0c0c0c;

    color:#777;

    padding:10px 16px;

    border-radius:999px;

    font-size:.72rem;

    cursor:pointer;

    transition:.3s ease;
}

.filter-btn:hover,
.filter-btn.active{
    border-color:var(--gold);
    color:var(--gold);
    background:rgba(212,175,55,.05);
}

.property-grid{
    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:18px;

    margin-top:25px;
}

.property-card{
    background:#0d0d0d;

    border:1px solid rgba(255,255,255,.07);

    border-radius:25px;

    overflow:hidden;

    transition:.45s ease;
}

.property-card:hover{
    transform:translateY(-8px);

    border-color:
    rgba(212,175,55,.3);

    box-shadow:
    0 25px 70px rgba(0,0,0,.5);
}

.property-image{
    height:270px;

    position:relative;

    background:
    linear-gradient(
        135deg,
        #17150e,
        #080808
    );

    overflow:hidden;
}

.property-image img{
    width:100%;
    height:100%;

    object-fit:cover;

    transition:.6s ease;
}

.property-card:hover
.property-image img{
    transform:scale(1.06);
}

.property-placeholder{
    width:100%;
    height:100%;

    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;

    color:#57534a;

    text-align:center;
    padding:30px;
}

.property-placeholder strong{
    color:#777;
    font-family:Georgia,serif;
    font-size:1.2rem;
}

.property-placeholder span{
    margin-top:7px;
    font-size:.7rem;
}

.property-status{
    position:absolute;

    top:16px;
    left:16px;

    padding:7px 11px;

    border-radius:999px;

    background:rgba(0,0,0,.72);

    backdrop-filter:blur(10px);

    border:1px solid rgba(255,255,255,.1);

    font-size:.6rem;
    font-weight:800;

    text-transform:uppercase;
    letter-spacing:1px;
}

.status-available{
    color:var(--green);
}

.status-reserved{
    color:#ffd66e;
}

.status-sold{
    color:var(--red);
}

.property-type{
    position:absolute;

    right:16px;
    top:16px;

    padding:7px 11px;

    border-radius:999px;

    background:rgba(212,175,55,.9);

    color:#050505;

    font-size:.58rem;

    font-weight:900;

    text-transform:uppercase;
}

.property-body{
    padding:23px;
}

.property-location{
    color:var(--gold);

    font-size:.65rem;

    text-transform:uppercase;
    letter-spacing:1.5px;
}

.property-name{
    margin-top:9px;

    font-family:Georgia,serif;

    font-size:1.4rem;
}

.property-description{
    color:#777;

    font-size:.77rem;

    margin-top:9px;

    display:-webkit-box;
    -webkit-line-clamp:3;
    -webkit-box-orient:vertical;
    overflow:hidden;
}

.property-details{
    display:flex;
    flex-wrap:wrap;

    gap:10px;

    margin-top:17px;

    padding-top:16px;

    border-top:1px solid rgba(255,255,255,.06);

    color:#777;

    font-size:.67rem;
}

.property-price{
    margin-top:18px;

    display:flex;
    justify-content:space-between;
    align-items:center;
}

.price{
    font-family:Georgia,serif;
    font-size:1.2rem;
    color:var(--white);
}

.property-btn{
    width:40px;
    height:40px;

    border-radius:12px;

    background:rgba(212,175,55,.1);

    border:1px solid rgba(212,175,55,.18);

    color:var(--gold);

    display:flex;
    align-items:center;
    justify-content:center;

    transition:.3s ease;
}

.property-btn:hover{
    background:var(--gold);
    color:#000;
}

/* =========================================================
   INTERNATIONAL
========================================================= */

.international{
    overflow:hidden;
}

.international-box{
    position:relative;

    padding:70px;

    border-radius:35px;

    border:1px solid rgba(212,175,55,.18);

    background:
    radial-gradient(
        circle at 80% 20%,
        rgba(212,175,55,.13),
        transparent 35%
    ),
    linear-gradient(
        135deg,
        #11100c,
        #070707
    );

    overflow:hidden;
}

.international-box::after{
    content:"GLOBAL";

    position:absolute;

    right:-30px;
    bottom:-60px;

    font-size:11rem;

    font-family:Georgia,serif;
    font-weight:bold;

    color:rgba(212,175,55,.025);

    pointer-events:none;
}

.global-badge{
    display:inline-block;

    padding:8px 13px;

    border:1px solid rgba(212,175,55,.25);

    color:var(--gold);

    border-radius:999px;

    font-size:.6rem;

    letter-spacing:2px;

    font-weight:800;
}

.international-box h2{
    position:relative;
    z-index:2;

    font-family:Georgia,serif;

    font-size:clamp(2.5rem,6vw,5rem);

    line-height:1;

    max-width:750px;

    margin-top:22px;
}

.international-box h2 span{
    color:var(--gold);
}

.international-box p{
    position:relative;
    z-index:2;

    color:#888;

    max-width:650px;

    margin-top:22px;
}

.country-list{
    position:relative;
    z-index:2;

    display:flex;
    flex-wrap:wrap;

    gap:9px;

    margin-top:30px;
}

.country{
    padding:9px 13px;

    border-radius:999px;

    border:1px solid rgba(255,255,255,.08);

    color:#999;

    font-size:.68rem;
}

/* =========================================================
   PARTNERS
========================================================= */

.partners-grid{
    display:grid;

    grid-template-columns:
    repeat(3,1fr);

    gap:16px;

    margin-top:50px;
}

.partner-card{
    padding:30px;

    border:1px solid rgba(255,255,255,.07);

    border-radius:25px;

    background:#0d0d0d;

    transition:.35s ease;
}

.partner-card:hover{
    border-color:rgba(212,175,55,.25);
    transform:translateY(-5px);
}

.partner-icon{
    font-size:1.8rem;
    color:var(--gold);
}

.partner-card h3{
    margin-top:18px;
    font-family:Georgia,serif;
}

.partner-card p{
    color:#777;
    font-size:.77rem;
    margin-top:8px;
}

/* =========================================================
   WHY AWF
========================================================= */

.why-grid{
    display:grid;

    grid-template-columns:
    repeat(4,1fr);

    gap:14px;

    margin-top:50px;
}

.why-card{
    padding:27px;

    min-height:210px;

    border-left:1px solid rgba(212,175,55,.3);

    background:
    linear-gradient(
        90deg,
        rgba(212,175,55,.045),
        transparent
    );
}

.why-card strong{
    display:block;

    font-family:Georgia,serif;

    font-size:2rem;

    color:var(--gold);
}

.why-card h3{
    margin-top:22px;

    font-size:.95rem;
}

.why-card p{
    margin-top:7px;

    color:#777;

    font-size:.73rem;
}

/* =========================================================
   CONTACT
========================================================= */

.contact-grid{
    display:grid;

    grid-template-columns:
    1fr 1fr;

    gap:50px;

    align-items:start;
}

.contact-cards{
    display:grid;
    gap:10px;

    margin-top:35px;
}

.contact-card{
    display:flex;

    align-items:center;

    gap:16px;

    padding:18px;

    border:1px solid rgba(255,255,255,.07);

    border-radius:18px;

    background:#0c0c0c;

    transition:.3s ease;
}

.contact-card:hover{
    border-color:rgba(212,175,55,.25);
}

.contact-icon{
    width:44px;
    height:44px;

    border-radius:13px;

    background:rgba(212,175,55,.08);

    border:1px solid rgba(212,175,55,.14);

    display:flex;
    align-items:center;
    justify-content:center;

    color:var(--gold);
}

.contact-card small{
    display:block;

    color:#666;

    font-size:.6rem;

    text-transform:uppercase;

    letter-spacing:1.5px;
}

.contact-card strong{
    display:block;

    margin-top:2px;

    font-size:.82rem;

    word-break:break-word;
}

.contact-form{
    padding:30px;

    border:1px solid rgba(255,255,255,.07);

    border-radius:28px;

    background:#0c0c0c;
}

.form-title{
    font-family:Georgia,serif;
    font-size:1.7rem;
}

.form-group{
    margin-top:15px;
}

.form-group label{
    display:block;

    color:#777;

    font-size:.65rem;

    margin-bottom:6px;
}

.form-group input,
.form-group textarea,
.form-group select{
    width:100%;

    padding:14px 15px;

    border-radius:13px;

    border:1px solid rgba(255,255,255,.08);

    background:#080808;

    color:white;

    outline:none;

    transition:.3s ease;
}

.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus{
    border-color:var(--gold);
}

.form-group textarea{
    min-height:120px;
    resize:vertical;
}

.form-submit{
    width:100%;
    margin-top:17px;
}

/* =========================================================
   FOOTER
========================================================= */

footer{
    border-top:1px solid rgba(255,255,255,.06);

    padding:55px 0 25px;

    background:#030303;
}

.footer-grid{
    display:grid;

    grid-template-columns:
    1.5fr 1fr 1fr;

    gap:50px;
}

.footer-logo img{
    width:145px;

    mix-blend-mode:screen;

    filter:
    drop-shadow(0 0 15px rgba(212,175,55,.12));
}

.footer-brand-text{
    color:#666;

    max-width:350px;

    font-size:.76rem;

    margin-top:18px;
}

.footer-title{
    color:var(--gold);

    text-transform:uppercase;

    letter-spacing:2px;

    font-size:.65rem;

    font-weight:800;

    margin-bottom:16px;
}

.footer-links{
    display:grid;
    gap:8px;
}

.footer-links a{
    color:#777;
    font-size:.75rem;

    transition:.25s ease;
}

.footer-links a:hover{
    color:var(--gold);
}

.footer-bottom{
    margin-top:45px;

    padding-top:20px;

    border-top:1px solid rgba(255,255,255,.05);

    display:flex;

    justify-content:space-between;

    gap:15px;

    color:#555;

    font-size:.65rem;
}

========================================================= */

    overflow-y:auto;

    padding:20px;
}

.manager-overlay.open{

}

.manager-brand{

.manager-brand img{

.manager-brand span{

.manager-close{
    width:40px;

.manager-body{

.manager-stats{

.manager-stat{

.manager-stat small{

.manager-stat strong{

    margin-top:5px;

}
